# 关于页数据（卡片式布局）
#
# 由 source/about/index.md 的 front-matter 里 `type: "about"` 触发。
# 模板 themes/anzhiyu/layout/includes/page/about.pug 读的就是这个文件。
#
# ⚠️ 重要：about.pug 里对下面这些键做了对象解构，例如
#       - let {maxim_tips, maxim_top, maxim_bottom} = item.maxim
#     **键本身缺失会导致构建直接报错**，但键存在、内部字段为空只会渲染成空白。
#    所以下面每个必需键都写了，留空的项你可以随时补。
#
# ⚠️ 图片全部用本地文件（/img/mine/ 下），不依赖任何第三方图床，
#    避免国内访问慢或外链失效。想换成自己的图，替换路径即可。

- class_name: 关于页
  subtitle: 生活明朗，万物可爱
  avatarImg: /img/mine/avatar.jpg
  # 这个名字会显示在「我是 XXX」里，也会出现在音乐卡的文案里
  name: 知识混子
  description: 独立开发者、博主，喜欢把想法做成能跑起来的东西

  aboutsiteTips:
    tips: 追求
    title1: 源于
    title2: 热爱而去 感受
    # word 至少需要 3 项（模板里取 length-2 和 length-1 做滚动效果）
    word:
      - 学习
      - 生活
      - 程序
      - 体验

  helloAbout: Hello there!

  skillsTips:
    tips: 技能
    title: 开启创造力

  careers:
    tips: 生涯
    title: 无限进步
    # careers.list 会被渲染成时间轴（当前主题版本读的是 list，官方文档写的是 item，两个都给上）
    list:
      - desc: 计算机相关专业 本科
        color: "#357ef5"
      - desc: 独立开发若干小工具与网站
        color: "#43a6c6"
      - desc: 折腾自己的博客
        color: "#c69043"
    item:
      - EDU,计算机相关专业
    img: /img/photos/bg-04-anchor-wall.jpg

  statistic:
    link: /archives
    text: 文章隧道
    # 铁路双轨向远处汇聚，正好对应「文章隧道」这个词
    cover: /img/photos/bg-01-railway.jpg

  map:
    title: 我现在住在
    StrengthenTitle: 中国，承德
    background: /img/photos/bg-02-misty-coast.jpg
    backgroundDark: /img/photos/bg-03-frost-field.jpg

  # ⚠️ 下面这三行原本是「生于 2002 / 某大学 / 大三学生」这种格式。
  # 按你的要求不暴露真实信息，改成了非身份类的描述。想改随意。
  selfInfo:
    selfInfoTips1: 身份
    selfInfoContentYear: 开发者
    selfInfoTips2: 专业方向
    selfInfoContent2: 计算机科学与技术
    selfInfoTips3: 现在在
    selfInfoContent3: 折腾博客

  # ⚠️ 性格卡：MBTI 类型我无从得知，请自己填。
  #    personality_type 填类型（如 INTJ-A），
  #    personality_img 是 16personalities 的示意图，可以去官网截图或找对应 SVG。
  personalities:
    author_name: 知识混子
    personality_type:
    photo_url: /img/mine/avatar.jpg
    personality_img: /img/mine/404-bg.jpg
    name_url: https://github.com/demokelite

  maxim:
    maxim_tips: 座右铭
    maxim_top: 生活明朗，
    maxim_bottom: 万物可爱。

  buff:
    buff_tips: 特长
    buff_top: 把想法做成
    buff_bottom: 能跑起来的东西

  # ⚠️ 这张卡原本是「原神 + UID」。你没有提供游戏信息，先填成中性内容。
  #    注意：game_title 如果填「原神」，模板会额外显示一个加载条动画。
  game:
    game_tips: 最近在做
    game_title: 视觉小说
    game_uid:
    game_bg: /img/mine/mascaloona-bliss.jpg
  # ⚠️ 追番列表需要 name / href / cover 三项，我没有你的追番数据，留空。
  #    填上任意条就会自动渲染成封面墙。
  comic:
    comic_tips: 关注方向
    comic_title: 独立游戏
    comic_list: []

  like:
    like_tips: 关注偏好
    like_title: 数码科技
    like_bg: /img/photos/bg-01-railway.jpg
    like_bottom: 手机、电脑软硬件

  music:
    music_tips: 音乐偏好
    music_title: 随便听听
    music_bg: /img/photos/bg-02-misty-coast.jpg
    music_link: /music

  # reward_list 是可选键，留空则不显示打赏榜。
  # 想开启就按下面格式加：
  # reward_list:
  #   - name: 某某
  #     amount: 6.6
  #     datatime: 2026-01-01
  #     suffix: 元        # 可选，默认「元」

  extra: false
