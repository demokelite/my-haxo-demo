# 装备 / 好物 数据文件
#
# 用途：给 /equipment/ 页面提供数据。适合列在用的硬件和软件。
#
# 在 Pages CMS（https://app.pagescms.org）里可以直接编辑这个文件。
#
# ---------------------------------------------------------------------------
# ⚠️ 字段名不能改，模板是按这些名字取的，改了就不显示：
#
# 顶层（可以有多组，比如「电脑」「软件」「桌面」各一组）
#   class_name       顶部横幅小标签
#   description      顶部横幅大标题
#   tip              横幅底部说明
#   top_background   横幅背景图路径，如 /img/photos/bg-04-anchor-wall.jpg
#   good_things      分组列表
#
# good_things 里每一组
#   title            分组标题
#   description      分组说明
#   equipment_list   这一组里的物件
#
# equipment_list 里每一件
#   name             名称
#   specification    规格，比如「16GB / 512GB」
#   description      一句话说明
#   image            图片路径（建议 400x400 左右，放 source/img/mine/ 下）
#   link             ★ 必填。详情链接。模板会调用 link.includes()，
#                    这一项**漏了会直接构建失败**，不是不显示而是整个站点报错。
#                    没有外部链接就填文章路径，比如 /2026/10/11/xxx/
# ---------------------------------------------------------------------------
#
# 下面是可用结构，填好内容后把前面的 # 去掉。
# 目前 good_things 为空，所以页面上只会显示横幅。

- class_name: 装备
  description: 在用的东西
  tip: 只列真正在用的，买了一直吃灰的不算
  top_background: /img/photos/bg-04-anchor-wall.jpg
  good_things: []

