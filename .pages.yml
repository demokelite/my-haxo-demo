# Pages CMS 配置
#
# 在线管理界面：https://app.pagescms.org
# 用 GitHub 账号登录后选择本仓库，即可在网页上写文章、改配置。
# 保存时会直接提交到本仓库的 main 分支，Vercel 随即自动重新构建。
#
# 文档：https://pagescms.org/docs/
#
# 说明：
# - 文章用「结构化字段」编辑（标题、分类、标签等是独立输入框）
# - 配置文件用 format: code，按纯文本编辑，**不会丢注释**
#   （若改用 format: yaml，Pages CMS 会解析后重新序列化，把 _config.anzhiyu.yml
#    里的大量中文注释全部抹掉，所以务必保持 code）

media:
  - name: mine
    label: 站点图片
    input: source/img/mine
    output: /img/mine

content:
  # ==================== 文章 ====================
  - name: posts
    label: 文章
    type: collection
    path: source/_posts
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
      fields: [title, date, categories, tags]
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 发布日期
        type: date
        options:
          time: true
        required: true
      - name: categories
        label: 分类
        type: string
        list: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: description
        label: 摘要
        type: text
      - name: cover
        label: 封面图
        type: image
      - name: body
        label: 正文
        type: rich-text

  # ==================== 草稿 ====================
  # source/_drafts/ 里的文章不会出现在网站上。
  # _config.yml 里 render_drafts: false，所以构建时直接跳过，
  # sitemap、首页、归档都不会有它们。
  #
  # 想发布某一篇：把文件从 source/_drafts/ 移到 source/_posts/ 即可
  # （或者在命令行跑 hexo publish <文件名>）。
  #
  # ⚠️ 缩进：这一项和上面的 posts 是同级，都挂在 content: 下面，
  #    所以必须是 2 个空格开头。写成 4 个空格会让整个 .pages.yml 解析失败，
  #    Pages CMS 直接打不开（站点构建不受影响，因为它不读这个文件）。
  - name: drafts
    label: 草稿（不会发布）
    type: collection
    path: source/_drafts
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
      fields: [title, date, tags]
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 计划发布日期
        type: date
        options:
          time: true
      - name: categories
        label: 分类
        type: string
        list: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: description
        label: 摘要
        type: text
      - name: cover
        label: 封面图
        type: image
      - name: body
        label: 正文
        type: rich-text

  # ==================== 主题与站点配置 ====================
  - name: theme-config
    label: 主题设置 _config.anzhiyu.yml
    type: file
    path: _config.anzhiyu.yml
    format: code

  - name: site-config
    label: 站点设置 _config.yml
    type: file
    path: _config.yml
    format: code

  - name: site-info-form
    label: ★ 需要你提供的信息
    type: file
    path: docs/site-info-form.md
    format: code

  - name: about-data
    label: 关于页数据 about.yml
    type: file
    path: source/_data/about.yml
    format: code

  # ==================== 数据文件 ====================
  - name: friend-links
    label: 友链数据 link.yml
    type: file
    path: source/_data/link.yml
    format: code

  - name: album-data
    label: 相册数据 album.yml
    type: file
    path: source/_data/album.yml
    format: code

  - name: skills-data
    label: 技能图标 creativity.yml
    type: file
    path: source/_data/creativity.yml
    format: code


  # ==================== 独立页面 ====================
  - name: pages
    label: 独立页面
    type: group
    items:
      - name: page-about
        label: 关于本人
        type: file
        path: source/about/index.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 标题
            type: string
          # ⚠️ 下面这几个字段必须在这里声明。
          #    Pages CMS 保存时会**丢弃所有没声明的 front-matter 键** ——
          #    2026-10-14 就因此出过一次：编辑搜索页的说明文字，
          #    结果 date / top_img / comments 连同正文里的 HTML 一起没了。
          #    所以凡是页面 front-matter 里用到的键，都要在下面列出来。
          - name: date
            label: 页面日期
            type: date
            options:
              time: true
          - name: top_img
            label: 顶部图（关掉填 false）
            type: boolean
          - name: comments
            label: 开启评论
            type: boolean
          # ⚠️ 这个字段决定页面的版面，**不要改**。
          #    删掉它页面会退回成普通文章页 —— 卡片式版面、友链样式、
          #    小房间特效全靠它。列在这里只是为了让 CMS 不要把它丢掉。
          - name: type
            label: 页面类型（勿改）
            type: string
          - name: body
            label: 正文
            type: rich-text

