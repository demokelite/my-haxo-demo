# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 知识混子的天地
subtitle: 碎碎念与技术笔记
description: 知识混子的个人博客。记录写代码、折腾项目、读书和日常的一些想法。
keywords: 个人博客,碎碎念,日常,技术分享
author: 知识混子
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
## 线上地址。Vercel 把 apex（zbnr.skin）308 永久跳转到 www，所以规范地址用 www。
## 改这里会影响 canonical、og:url、og:image、sitemap、RSS —— 都要指向线上域名，
## 否则分享卡片和搜索引擎会拿到错误的地址。
## 本地预览仍用 http://localhost:4000（Hexo 默认端口，不是 Hugo 的 1313）。
url: https://www.zbnr.skin
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  # 关掉 trailing_index 后，/about/index.html 会写成 /about/，
  # canonical 与 og:url 才指向同一个地址。
  # 之前开着时两者不一致（canonical 是 /about/，og:url 是 /about/index.html），
  # 等于告诉搜索引擎两个互相矛盾的规范地址。
  # 文件实际路径不变（仍是 public/about/index.html），Vercel 两个地址都能访问。
  trailing_index: false
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
# 日期在未来的文章也照常生成，日期只作为显示值。
# （曾用过 future: false + GitHub Actions 定时重建做定时发布，2026-10-13 因
#   GitHub 丢弃了整点的 cron 而漏发，作者决定不折腾了，已整体移除。）
#
# ⚠️ 由此带来的一条约定：**发表草稿时要把 date 改成当天。**
#    草稿里常写着未来日期（作者写草稿时随手挑的），而 future: true 不会让它们
#    等到那天才发 —— 一移进 _posts/ 就立刻上线，但显示成未来日期，
#    还会排在文章列表最前面。
#    这一步已经做成脚本，别再手动改：
#        powershell -ExecutionPolicy Bypass -File tools/publish.ps1            # 列出草稿
#        powershell -ExecutionPolicy Bypass -File tools/publish.ps1 -Name xxx  # 发表并改日期
#    （2026-10-14 与作者确认：保持现状，靠脚本在发表时改日期，不恢复定时发布。）
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: anzhiyu

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''
